services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example first}
      POSTGRES_DB: blogdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@database:5432/blogdb
      TOKEN_SECRET: ${TOKEN_SECRET:?Create .env from .env.example first}

    volumes:
      - uploads:/app/uploads
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
